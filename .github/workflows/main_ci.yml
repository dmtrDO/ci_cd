# ЗАДАЧА 1 (Автоматичне тестування з Pytest)

name: Python Project CI

# Коли запускати? При кожному push у гілку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # На якій ОС запускати?
    runs-on: ubuntu-latest

    steps:
    # 1. "Скачуємо" код репозиторію на віртуальну машину
    - uses: actions/checkout@v4

    # 2. Встановлюємо Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Встановлюємо залежності (бібліотеки для краулера)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Запускаємо тести (Завдання №1)
    - name: Run tests with pytest
      run: |
        pytest

# ЗАДАЧА 2 Перевірка стилю коду (Linting))

    - name: Run Linting (flake8)
      run: |
        pip install flake8
        # Перевірка на критичні помилки
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Перевірка на відповідність PEP 8
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics